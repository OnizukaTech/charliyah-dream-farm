<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Charliyah's Dream Farm</title>
  <meta name="description" content="A little world of your own, where dreams grow. A cozy farming game made especially for Charliyah.">
  <meta name="theme-color" content="#fbe9cf">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dream Farm">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/fredoka-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <section id="title" class="screen active" aria-label="Title screen"></section>
    <section id="create" class="screen" aria-label="Create your character"></section>
    <section id="game" class="screen" aria-label="Charliyah's Dream Farm">
      <header id="hud"></header>
      <main id="view" tabindex="-1"></main>
      <nav id="nav" aria-label="Farm areas"></nav>
    </section>
  </div>
  <div id="tutBar" aria-live="polite"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="cloverPop"></div>
  <noscript><p style="padding:2em;font-family:sans-serif;text-align:center">Dream Farm needs JavaScript turned on to grow. 🌱</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/views/farm.js"></script>
  <script src="js/views/garden.js"></script>
  <script src="js/views/animals.js"></script>
  <script src="js/views/house.js"></script>
  <script src="js/views/market.js"></script>
  <script src="js/views/learn.js"></script>
  <script src="js/views/journal.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
